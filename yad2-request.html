<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בקשת הצעת מחיר לרכב</title>
<style>
  :root{--bg:#0e1117;--card:#171c26;--line:#2a3140;--txt:#e9edf4;--mut:#9aa6b8;--accent:#ffd21a;--ok:#2ec77a}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);
       min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:560px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .grid .full{grid-column:1/-1}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 5px}
  input,textarea{width:100%;background:#0e131b;border:1px solid var(--line);border-radius:10px;
       color:var(--txt);padding:12px 13px;font-size:16px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .sec{font-size:13px;color:var(--accent);margin:18px 0 2px;font-weight:600}
  button{width:100%;margin-top:20px;background:var(--accent);color:#111;border:0;border-radius:12px;
       padding:15px;font-size:17px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{padding:14px;border-radius:12px;font-size:15px;text-align:center}
  .msg.ok{background:rgba(46,199,122,.12);color:var(--ok);border:1px solid rgba(46,199,122,.3)}
  .msg.err{background:rgba(255,80,80,.1);color:#ff8a8a;border:1px solid rgba(255,80,80,.3)}
  .req:after{content:" *";color:#ff8a8a}
  a.track{display:inline-block;margin-top:12px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="sub">טוען…</div></div></div>
<script>
const SB_URL="https://xppsvottiwbjsjlusief.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcHN2b3R0aXdianNqbHVzaWVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzg5NzYsImV4cCI6MjEwNjk1NDk3Nn0.b9WaudA0bbKQiEVHtdnChETITTq4Tl2oPEHPnzwWsZo";
async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
const qs=new URLSearchParams(location.search), LINK=qs.get("a")||"";
const app=document.getElementById("app");
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function field(parent,label,id,type,full,req){
  const w=el("div",full?"full":"");const l=el("label",req?"req":"",label);l.htmlFor=id;
  const i=el(type==="textarea"?"textarea":"input");i.id=id;if(type!=="textarea")i.type=type;if(type==="number")i.inputMode="numeric";
  w.appendChild(l);w.appendChild(i);parent.appendChild(w);return i;
}
function build(){
  const c=el("div","card");app.innerHTML="";app.appendChild(c);
  c.appendChild(el("h1","","בקשת הצעת מחיר לרכב"));
  c.appendChild(el("div","sub","מלא את פרטי הרכב — נשלח לסוחרי היד2 לקבלת הצעות, ותקבל קישור מעקב לתוצאה."));
  c.appendChild(el("div","sec","פרטי הרכב"));
  const g=el("div","grid");c.appendChild(g);
  const F={};
  F.make=field(g,"יצרן","f_make","text",false,true);
  F.model=field(g,"דגם","f_model","text",false,false);
  F.trim=field(g,"רמת גימור","f_trim","text",false,false);
  F.year=field(g,"שנה","f_year","number",false,false);
  F.km=field(g,"ק\"מ","f_km","number",false,false);
  F.hand=field(g,"יד","f_hand","text",false,false);
  F.color=field(g,"צבע","f_color","text",false,false);
  F.plate=field(g,"מספר רישוי","f_plate","text",false,false);
  F.desc=field(g,"תיאור / הערות","f_desc","textarea",true,false);
  c.appendChild(el("div","sec","הפרטים שלך"));
  const g2=el("div","grid");c.appendChild(g2);
  F.name=field(g2,"שם הסוכן","f_name","text",false,true);
  F.phone=field(g2,"טלפון","f_phone","tel",false,false);
  F.email=field(g2,"מייל (לקבלת תוצאה)","f_email","email",true,false);
  F.org=field(g2,"מותג / סניף","f_org","text",true,false);
  const btn=el("button","","שליחת בקשה");c.appendChild(btn);
  btn.onclick=async()=>{
    if(!F.make.value.trim()||!F.name.value.trim()){(!F.make.value.trim()?F.make:F.name).focus();return;}
    btn.disabled=true;btn.textContent="שולח…";
    try{
      const res=await rpc("tender_request_create",{
        p_link_token:LINK,p_make:F.make.value.trim(),p_model:F.model.value.trim(),p_trim:F.trim.value.trim(),
        p_year:F.year.value?Number(F.year.value):null,p_km:F.km.value?Number(F.km.value):null,
        p_hand:F.hand.value.trim(),p_color:F.color.value.trim(),p_plate:F.plate.value.trim(),
        p_description:F.desc.value.trim(),p_agent_name:F.name.value.trim(),p_agent_phone:F.phone.value.trim(),
        p_agent_email:F.email.value.trim(),p_agent_org:F.org.value.trim()});
      if(res&&res.ok){
        const cc=el("div","card");app.innerHTML="";app.appendChild(cc);
        cc.appendChild(el("h1","","✓ הבקשה נשלחה"));
        cc.appendChild(el("div","msg ok","הבקשה התקבלה. נעביר אותה לסוחרים ותקבל את התוצאה."));
        const trk="/yad2-track.html?track="+encodeURIComponent(res.track_token);
        const a=el("a","track","למעקב אחר התוצאה »");a.href=trk;cc.appendChild(a);
      }else{
        btn.disabled=false;btn.textContent="שליחת בקשה";
        c.appendChild(el("div","msg err",res&&res.error==="bad_link"?"קישור לא תקין.":"שליחה נכשלה, נסה שוב."));
      }
    }catch(e){btn.disabled=false;btn.textContent="שליחת בקשה";c.appendChild(el("div","msg err","שגיאת רשת, נסה שוב."));}
  };
}
build();
</script>
</body>
</html>
