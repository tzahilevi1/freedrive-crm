<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב בקשת הצעה</title>
<style>
  :root{--bg:#0e1117;--card:#171c26;--line:#2a3140;--txt:#e9edf4;--mut:#9aa6b8;--accent:#ffd21a;--ok:#2ec77a}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);
       min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:480px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  .car{font-size:17px;font-weight:700;margin:4px 0 16px}
  .pill{display:inline-block;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600}
  .pill.open{background:rgba(255,210,26,.15);color:var(--accent)}
  .pill.done{background:rgba(46,199,122,.15);color:var(--ok)}
  .pill.closed{background:rgba(255,80,80,.12);color:#ff8a8a}
  .win{margin-top:18px;font-size:15px;color:var(--mut)}
  .win b{color:var(--ok);font-size:26px;display:block;margin-top:4px}
  .mut{color:var(--mut);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="mut">טוען…</div></div></div>
<script>
const SB_URL="https://xppsvottiwbjsjlusief.supabase.co";
const SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcHN2b3R0aXdianNqbHVzaWVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzg5NzYsImV4cCI6MjEwNjk1NDk3Nn0.b9WaudA0bbKQiEVHtdnChETITTq4Tl2oPEHPnzwWsZo";
async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
const qs=new URLSearchParams(location.search), TRK=qs.get("track")||"";
const app=document.getElementById("app");
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function money(n){return Number(n||0).toLocaleString("he-IL");}
async function load(){
  if(!TRK){app.innerHTML="";app.appendChild(el("div","card")).appendChild(el("div","mut","קישור לא תקין."));return;}
  let d;try{d=await rpc("tender_track_get",{p_track_token:TRK});}catch(e){return;}
  if(!d||!d.ok)return;
  const c=el("div","card");app.innerHTML="";app.appendChild(c);
  c.appendChild(el("h1","","מעקב בקשת הצעה"));
  const car=d.car||{};const title=[car.make,car.model,car.year].filter(Boolean).join(" ");
  c.appendChild(el("div","car",title||"רכב"+(car.plate?" · "+car.plate:"")));
  const map={draft:["ממתין לשליחה","open"],open:["המכרז פתוח — אוסף הצעות","open"],
    awarded:["נבחרה הצעה זוכה","done"],closed:["נסגר ללא הצעות","closed"],cancelled:["בוטל","closed"]};
  const st=map[d.status]||["—","open"];
  c.appendChild(el("span","pill "+st[1],st[0]));
  if(d.winner){
    const w=el("div","win","ההצעה הזוכה");
    const b=el("b");b.textContent=money(d.winner.amount)+" ₪";w.appendChild(b);
    c.appendChild(w);
  }else if(d.status==="open"){
    c.appendChild(el("div","mut","הדף מתעדכן אוטומטית. התוצאה תופיע כאן בסגירת המכרז."));
  }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
