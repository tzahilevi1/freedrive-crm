# פריסת האתר הסטטי ל-GitHub Pages.
# הבנייה הישנה (Jekyll) נתקעה ונכשלה שלוש פעמים ברצף בלי פירוט שגיאה.
# כאן אין שלב עיבוד כלל — התוכן מועלה כמו שהוא, והלוגים גלויים.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
