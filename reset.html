<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!--  הגנת מסגור. frame-ancestors אינו נתמך בתגית meta ו-GitHub Pages אינו
      מגיש כותרות HTTP, ולכן זו ההגנה היחידה מפני clickjacking כאן: הדף
      מוסתר עד שמתברר שהוא אינו בתוך מסגרת של אתר אחר. ה-style מוסר רק
      בעמוד עליון, כך שגם דפדפן שיחסום את הניווט לא יציג את התוכן. -->
<style id="af">html{display:none!important}</style>
<script>(function(){try{if(self===top){var e=document.getElementById('af');e&&e.parentNode.removeChild(e);}else{top.location.replace(self.location.href);}}catch(x){top.location.replace(self.location.href);}})();</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://data.gov.il https://api.ipify.org; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0B0B">
<title>פרי דרייב · איפוס סיסמה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#6E8B10;--brand-deep:#4F6608;--surface:#fff;--surface-2:#f0f1f4;--line:#e5e7eb;--txt:#1c2430;--muted:#7b8494;--danger:#e2555a;--ok:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Heebo",Arial,sans-serif;color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#12141a,#1b1e26)}
  .card{background:var(--surface);border-radius:20px;padding:36px 30px;width:100%;max-width:390px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  h1{margin:0 0 4px;font-size:23px}h1 b{color:var(--brand)}
  p{margin:0 0 22px;color:var(--muted);font-size:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  input{width:100%;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--brand)}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
  .btn:hover{background:var(--brand-deep)}
  .msg{font-size:13.5px;margin-top:12px;min-height:18px}
  .msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}
  a{color:var(--brand)}
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>פרי דרייב · איפוס סיסמה</h1>
    <p id="sub">בחרו סיסמה חדשה לחשבון שלכם.</p>
    <div id="fields">
      <label for="pw">סיסמה חדשה</label>
      <input type="password" id="pw" autocomplete="new-password" minlength="6" placeholder="אותיות באנגלית וספרות" required>
      <label for="pw2">אימות סיסמה (שוב, בדיוק אותו דבר)</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="6" placeholder="הקלידו שוב את אותה סיסמה" required>
      <p style="font-size:12px;color:var(--muted,#8a94a6);margin:2px 0 0">הסיסמה חייבת לכלול <b>אותיות באנגלית וספרות</b>, לפחות 6 תווים.</p>
      <button type="submit" class="btn" style="margin-top:12px">שמור סיסמה והתחבר</button>
    </div>
    <div class="msg" id="msg"></div>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(function () {
  var MASTER_URL = 'https://gfwopgoydfqiouratcpc.supabase.co';
  var MASTER_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd29wZ295ZGZxaW91cmF0Y3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDg0NTUsImV4cCI6MjEwMzIyNDQ1NX0.ukPDUGS7KjYgD7jAhzSqAEKo_eJ8gQwsHMqTBGXeux8';
  var msg = document.getElementById('msg');
  function show(t, ok) { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

  //  מודע-מותג: קישור השחזור מגיע ממותג (?org=<slug>) או מהמאסטר (בלי org).
  //  ה-session של השחזור שייך לפרויקט שהנפיק אותו — לכן יוצרים את הלקוח של
  //  אותו פרויקט. לקוח-פותר (detectSessionInUrl:false, לא נוגע ב-hash) שולף את
  //  חיבור-המותג מהמאסטר, ואז הלקוח האמיתי (ברירת-מחדל) קורא את ה-session מה-hash.
  var db = null;
  function bind(url, anon) { db = window.supabase.createClient(url, anon); }
  var org = new URLSearchParams(location.search).get('org');
  if (org) {
    var rc = window.supabase.createClient(MASTER_URL, MASTER_ANON, { auth: { detectSessionInUrl: false, persistSession: false } });
    rc.rpc('fleet_resolve', { p_slug: org }).then(function (r) {
      var d = (r && r.data) || {};
      if (!(r && r.error) && d.supabase_url && d.anon_key) bind(d.supabase_url, d.anon_key);
      else bind(MASTER_URL, MASTER_ANON);
    }, function () { bind(MASTER_URL, MASTER_ANON); });
  } else {
    bind(MASTER_URL, MASTER_ANON);
  }
  var loginHref = org ? ('https://crm.freedrive.co.il/' + encodeURIComponent(org)) : 'https://crm.freedrive.co.il/admin.html';

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!db) return show('טוען פרטי חיבור… נסו שוב בעוד רגע.');
    var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    if (!/^[A-Za-z0-9]+$/.test(pw)) return show('הסיסמה יכולה להכיל רק אותיות באנגלית וספרות (בלי עברית או רווחים).');
    if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) return show('הסיסמה חייבת לכלול גם אותיות באנגלית וגם ספרות.');
    if (pw.length < 6) return show('הסיסמה חייבת להכיל לפחות 6 תווים.');
    if (pw !== pw2) return show('הסיסמאות אינן תואמות — הקלידו את אותה סיסמה בשני השדות.');
    show('שומר…', true);
    db.auth.updateUser({ password: pw }).then(function (r) {
      if (r.error) return show('שגיאה: ' + r.error.message + ' — ייתכן שהקישור פג. בקשו איפוס מחדש בעמוד הכניסה.');
      document.getElementById('fields').style.display = 'none';
      show('הסיסמה עודכנה! ', true);
      msg.innerHTML = 'הסיסמה עודכנה בהצלחה ✅ <a href="' + loginHref + '">כניסה למערכת →</a>';
    });
  });
})();
</script>
</body>
</html>
